<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MCR Discard Trainer</title>
  <style>
    :root {
      /* square render size (S) for tiles; content is cropped from 128px PNGs */
      --tile-s: 72px;
      --disc-s: 40px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #0f5132;
      color: #f5f5f5;
      overflow-x: hidden;
    }
    h1 { margin: 0 0 12px; font-size: 22px; }
    #stats {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      background: #114d2c;
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 15px;
    }
    #stats b { font-size: 18px; }
    button {
      font-size: 15px;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background: #ffc107;
      color: #222;
      cursor: pointer;
      font-weight: 600;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    #message { min-height: 24px; margin: 10px 0; font-size: 16px; }
    .hand-zone {
      display: flex;
      align-items: flex-end;
      gap: 0;
      padding: 14px;
      background: rgba(0,0,0,0.18);
      border-radius: 10px;
      min-height: 96px;
      flex-wrap: wrap;
    }
    /* tiles are 128x128 PNGs with 23px transparent padding each side
       (content x: 23..105). Rendered as cropped backgrounds: for a square
       display size S, content width = S*82/128 and left offset = S*23/128. */
    .tile {
      display: inline-block;
      vertical-align: bottom;
      width: calc(var(--tile-s) * 82 / 128);
      height: var(--tile-s);
      background-repeat: no-repeat;
      background-size: var(--tile-s) var(--tile-s);
      background-position: calc(var(--tile-s) * -23 / 128) 0;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.08s, box-shadow 0.08s;
      touch-action: manipulation;
    }
    @media (hover: hover) {
      .tile.clickable:hover {
        transform: translateY(-10px);
        box-shadow: 0 6px 10px rgba(0,0,0,0.4);
      }
    }
    .tile.clickable:active {
      transform: translateY(-8px);
      box-shadow: 0 5px 9px rgba(0,0,0,0.45);
    }
    .tile.static { cursor: default; }
    .drawn-sep { width: 16px; }
    .drawn-tile { box-shadow: 0 0 0 3px #ffc107; position: relative; z-index: 1; }
    .win-tiles { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0; }
    .tile-group { display: inline-flex; margin-right: 16px; }
    .pile-label { font-size: 13px; color: #cfe9cf; margin: 14px 0 4px; }
    #discardZone {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      padding: 8px;
      background: rgba(0,0,0,0.12);
      border-radius: 8px;
      min-height: 48px;
    }
    .disc {
      display: inline-block;
      width: calc(var(--disc-s) * 82 / 128);
      height: var(--disc-s);
      background-repeat: no-repeat;
      background-size: var(--disc-s) var(--disc-s);
      background-position: calc(var(--disc-s) * -23 / 128) 0;
      border-radius: 3px;
    }
    .disc.clickable { cursor: pointer; }
    @media (hover: hover) {
      .disc.clickable:hover { transform: translateY(-4px); }
    }
    /* a discard that was scored as a mistake, so it stands out in the review */
    .disc.err { box-shadow: 0 0 0 2px #e05260; }
    .disc.sel { outline: 2px solid #ffc107; outline-offset: 1px; }
    .disc.drawn { box-shadow: 0 0 0 2px #ffc107; }
    .review-head {
      font-size: 13px;
      font-weight: 700;
      color: #ffe08a;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .review-hand { display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 10px; }
    .review-sep { width: 10px; }
    .hint { font-size: 13px; color: #cfe9cf; }
    .feedback {
      margin: 16px 0;
      padding: 14px 16px;
      border-radius: 8px;
      background: #114d2c;
      font-size: 15px;
    }
    .feedback.error { background: #5c1f24; }
    .feedback.ok { background: #14502d; }
    .accrow { margin-top: 6px; font-size: 13px; color: #d7e7d7; }
    .mini { width: 34px; vertical-align: middle; margin: 0 1px; }
    #wins .win-card {
      background: #114d2c;
      border-radius: 10px;
      padding: 14px 16px;
      margin: 14px 0;
    }
    #wins .win-card.valid { box-shadow: 0 0 0 2px #ffc107; }
    #wins .win-card.invalid { opacity: 0.7; }
    pre { font-size: 13px; line-height: 1.25; margin: 8px 0 0; overflow-x: auto; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      margin-left: 8px;
    }
    .badge.valid { background: #ffc107; color: #222; }
    .badge.invalid { background: #555; color: #eee; }
    #loading {
      font-style: italic;
      color: #cfe9cf;
    }
    #loading::after {
      content: '';
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-left: 8px;
      vertical-align: -1px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #ffc107;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    #seedInput {
      font-size: 14px;
      padding: 7px 10px;
      border: none;
      border-radius: 6px;
      width: 160px;
    }
    #seedDisplay { font-size: 14px; color: #cfe9cf; }
    .link-btn {
      background: transparent;
      color: #ffc107;
      font-weight: 600;
      padding: 0 4px;
      font-size: 13px;
    }
    .type-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
      font-size: 13px;
    }
    .type-name { min-width: 130px; font-weight: 700; color: #ffe08a; }
    .type-cols { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 4px; }
    .type-col { flex: 1; min-width: 240px; }
    .type-col h4 { margin: 6px 0 2px; font-size: 13px; color: #d7e7d7; }

    /* ---- responsive / mobile ---- */
    @media (max-width: 600px) {
      :root { --tile-s: 64px; --disc-s: 34px; }
      body { padding: 12px; }
      h1 { font-size: 20px; margin-bottom: 10px; }
      #stats {
        gap: 8px 14px;
        padding: 8px 12px;
        font-size: 13px;
        margin-bottom: 12px;
      }
      #stats b { font-size: 16px; }
      #controls { gap: 8px; }
      button { padding: 12px 16px; font-size: 15px; }
      #newGameBtn { flex: 1 1 auto; }
      #seedInput { flex: 1 1 120px; width: auto; min-width: 0; }
      .hand-zone {
        gap: 4px 3px;
        padding: 12px 8px;
      }
      .drawn-sep { width: 10px; }
      .type-cols { flex-direction: column; gap: 10px; }
      .type-col { min-width: 0; }
      .type-name { min-width: 0; }
    }

    /* keep a full 14-tile hand comfortably tappable on very narrow phones */
    @media (max-width: 380px) {
      :root { --tile-s: 58px; }
    }
  </style>
</head>
<body>
  <h1>MCR Discard Trainer</h1>

  <div id="stats">
    <div>Turn: <b id="s-turns">0</b></div>
    <div>Errors: <b id="s-errors">0</b></div>
    <div>Accuracy: <b id="s-acc">--</b></div>
    <div>Away: <b id="s-shanten">--</b></div>
    <div>Round wind: <b id="s-prevalent">--</b></div>
    <div>Seat wind: <b id="s-seat">--</b></div>
  </div>

  <div id="controls">
    <button id="newGameBtn" disabled>Loading engine…</button>
    <input id="seedInput" type="text" inputmode="numeric" placeholder="Seed (optional)">
    <span id="seedDisplay" hidden>Seed: <b id="seedValue"></b>
      <button id="copySeedBtn" type="button" class="link-btn">Copy</button>
    </span>
    <button id="shareBtn" type="button" class="link-btn" hidden>Copy run link</button>
  </div>

  <div id="message"></div>

  <div id="handZone" class="hand-zone"></div>

  <div class="pile-label">Discards <span id="discardHint" class="hint" hidden>— click one to review that turn</span></div>
  <div id="discardZone"></div>

  <div id="feedback"></div>

  <div id="wins"></div>

  <script>
    // ---- count-vector index: m=0-8, p=9-17, s=18-26, z=27-33 ----
    const FAMILY_OFFSET = { m: 0, p: 9, s: 18, z: 27 };
    const WIND_NAMES = { 1: 'East', 2: 'South', 3: 'West', 4: 'North' };
    function tileIndex(t) { return FAMILY_OFFSET[t[1]] + (parseInt(t[0], 10) - 1); }
    function tileImg(t, cls) {
      return `<img src="tiles-png/${t}.png" class="${cls}" data-tile="${t}" alt="${t}">`;
    }
    // cropped background tile (removes the 23px transparent side padding)
    function tileEl(t, cls) {
      return `<span class="${cls}" data-tile="${t}" style="background-image:url('tiles-png/${t}.png')"></span>`;
    }
    function allTileStrings() {
      const all = [];
      ['m', 'p', 's'].forEach(f => { for (let n = 1; n <= 9; n++) all.push(n + f); });
      for (let n = 1; n <= 7; n++) all.push(n + 'z');
      return all;
    }
    // index -> tile string, the exact inverse of tileIndex()
    const TILE_BY_INDEX = allTileStrings();
    function tileFromIndex(i) { return TILE_BY_INDEX[i]; }
    // preload every tile image so newly drawn tiles render with no latency
    allTileStrings().forEach(t => { const im = new Image(); im.src = 'tiles-png/' + t + '.png'; });
    function removeOne(arr, val) {
      const i = arr.indexOf(val);
      if (i >= 0) arr.splice(i, 1);
      return arr;
    }
    function sortTiles(tiles) {
      return [...tiles].sort((a, b) => tileIndex(a) - tileIndex(b));
    }

    // ---- game state ----
    let worker = null;
    let state = null;
    let reqId = 0;
    const pending = {};

    // keep version in sync with training_worker.js APP_VERSION for cache-busting
    const APP_VERSION = "2026-09-01-1";
    function initEngine() {
      worker = new Worker('training_worker.js?v=' + APP_VERSION, { type: 'module' });
      worker.onmessage = (event) => {
        const msg = event.data;
        if (msg.type === 'ready') {
          const btn = document.getElementById('newGameBtn');
          btn.disabled = false;
          btn.textContent = 'New Game';
          return;
        }
        if (msg.type === 'fatal') {
          setMessage('Engine failed to load: ' + msg.error);
          return;
        }
        const cb = pending[msg.id];
        if (!cb) return;
        delete pending[msg.id];
        if (msg.type === 'error') cb.reject(new Error(msg.error));
        else cb.resolve(msg.result);
      };
      worker.onerror = (e) => setMessage('Engine error: ' + e.message);
    }
    initEngine();

    function pyCall(fn, ...args) {
      return new Promise((resolve, reject) => {
        const id = ++reqId;
        pending[id] = { resolve, reject };
        worker.postMessage({ id, fn, args });
      });
    }

    function setMessage(html) { document.getElementById('message').innerHTML = html; }
    // Any rejected engine call must clear the "thinking" spinner, otherwise the
    // UI stays stuck on it forever with no clue about what went wrong.
    function engineFailure(err) {
      console.error(err);
      setMessage('Engine error: ' + ((err && err.message) || err)
        + '<br>Turn aborted — press “New Game” to restart.');
      document.getElementById('newGameBtn').disabled = false;
      if (state) state.finished = true;
    }
    function setLoading(on) {
      document.getElementById('message').innerHTML = on ? '<span id="loading">Engine is thinking…</span>' : '';
    }

    function updateStats(shanten) {
      document.getElementById('s-turns').textContent = state.turns;
      document.getElementById('s-errors').textContent = state.errors;
      document.getElementById('s-acc').textContent =
        state.turns === 0 ? '--' : Math.round((state.turns - state.errors) / state.turns * 100) + '%';
      if (shanten !== undefined) document.getElementById('s-shanten').textContent = shanten;
      document.getElementById('s-prevalent').textContent =
        state ? WIND_NAMES[state.prevalentWind] : '--';
      document.getElementById('s-seat').textContent =
        state ? WIND_NAMES[state.seatWind] : '--';
    }

    function showSeed(seed) {
      document.getElementById('seedValue').textContent = seed;
      document.getElementById('seedDisplay').hidden = false;
    }

    async function newGame() {
      document.getElementById('newGameBtn').disabled = true;
      document.getElementById('feedback').innerHTML = '';
      document.getElementById('discardZone').innerHTML = '';
      document.getElementById('wins').innerHTML = '';
      document.getElementById('shareBtn').hidden = true;
      document.getElementById('discardHint').hidden = true;
      clearRunHash();
      const seedRaw = document.getElementById('seedInput').value.trim();
      const seedArgs = /^\d+$/.test(seedRaw) ? [seedRaw] : [];
      const game = JSON.parse(await pyCall('new_game', ...seedArgs));
      const pool = game.pool;
      const visible = new Array(34).fill(0);
      const hand = pool.slice(0, 13);
      hand.forEach(t => visible[tileIndex(t)]++);
      state = {
        pool, pointer: 13, hand, visible, discards: [], turns: 0, errors: 0,
        drawn: null, turnData: null, seed: game.seed,
        prevalentWind: game.prevalent_wind, seatWind: game.seat_wind,
        initialHand: [...hand], history: [], wins: null,
        selectedTurn: null, replay: false, finished: false,
      };
      showSeed(game.seed);
      updateStats('--');
      document.getElementById('newGameBtn').disabled = false;
      await startTurn();
    }

    function renderDiscards() {
      const zone = document.getElementById('discardZone');
      zone.innerHTML = state.discards.map((t, i) => {
        const rec = state.history[i];
        const cls = 'disc clickable'
          + (rec && rec.isError ? ' err' : '')
          + (state.selectedTurn === i ? ' sel' : '');
        return `<span class="${cls}" data-turn="${i}" `
          + `title="Turn ${i + 1}" style="background-image:url('tiles-png/${t}.png')"></span>`;
      }).join('');
      zone.querySelectorAll('[data-turn]').forEach(el => {
        el.addEventListener('click', () => reviewTurn(parseInt(el.dataset.turn, 10)));
      });
      document.getElementById('discardHint').hidden = state.history.length === 0;
      document.getElementById('shareBtn').hidden = state.history.length === 0;
    }

    function endRun() {
      state.finished = true;
      renderDiscards();
    }

    async function startTurn() {
      // draw a tile
      const drawn = state.pool[state.pointer++];
      if (drawn === undefined) {
        setMessage('Wall is empty — exhaustive draw. Start a new game.');
        endRun();
        return;
      }
      state.hand.push(drawn);
      state.visible[tileIndex(drawn)]++;
      state.drawn = drawn;
      renderHand(false);
      setLoading(true);
      const res = JSON.parse(await pyCall('analyze_turn',
        JSON.stringify(state.hand), JSON.stringify(state.visible),
        state.prevalentWind, state.seatWind));
      state.turnData = res;
      updateStats(res.engine.away);
      setLoading(false);
      setMessage('Your turn — click a tile to <b>discard</b>.');
      renderHand(true);
    }

    function renderHand(clickable) {
      const rest = sortTiles(removeOne([...state.hand], state.drawn));
      const cls = clickable ? 'tile clickable' : 'tile static';
      let html = rest.map(t => tileEl(t, cls)).join('');
      if (state.drawn) {
        html += '<span class="drawn-sep"></span>';
        html += tileEl(state.drawn, cls + ' drawn-tile');
      }
      const zone = document.getElementById('handZone');
      zone.innerHTML = html;
      if (clickable) {
        zone.querySelectorAll('.clickable').forEach(el => {
          el.addEventListener('click', () => onDiscard(el.dataset.tile).catch(engineFailure));
        });
      }
    }

    async function onDiscard(tile) {
      const data = state.turnData;
      const engTile = data.engine_discard;
      const engData = data.engine;

      // freeze the board and score the user's discard on demand
      renderHand(false);
      setLoading(true);
      const handBefore = [...state.hand];
      const handBeforeDiscard = JSON.stringify(state.hand);
      const drawn = state.drawn;
      const userData = (tile === engTile)
        ? engData
        : JSON.parse(await pyCall('evaluate_discard',
            handBeforeDiscard, tile, JSON.stringify(state.visible),
            state.prevalentWind, state.seatWind));
      setLoading(false);

      state.turns++;
      const isError = userData.away > engData.away || (userData.away === engData.away && userData.number < engData.number);
      if (isError) state.errors++;

      // keep everything needed to replay this turn's feedback with no re-analysis
      const record = {
        turn: state.turns, drawn, handBefore, discard: tile,
        engDiscard: engTile, user: userData, eng: engData, isError,
      };
      state.history.push(record);

      // perform the discard (visible vector keeps the tile as "seen")
      removeOne(state.hand, tile);
      state.drawn = null;
      state.discards.push(tile);
      renderHand(false);
      updateStats(userData.away);
      renderFeedback(record, false);

      // end-of-game detection: tenpai (0-shanten) to a valid (>=8 pts) hand
      if (userData.away === 0) {
        setLoading(true);
        const wins = JSON.parse(await pyCall('score_winning_tiles',
          JSON.stringify(sortTiles(state.hand)), JSON.stringify(userData.acceptance),
          false, false, state.prevalentWind, state.seatWind));
        setLoading(false);
        const hasValid = wins.some(w => w.points >= 8);
        if (hasValid) { state.wins = wins; endRun(); showWins(wins); return; }
      }
      // immediately start the next turn; the feedback above stays visible
      await startTurn();
    }

    function handPreview(rec) {
      const rest = sortTiles(removeOne([...rec.handBefore], rec.drawn));
      return '<div class="review-hand">'
        + rest.map(t => tileEl(t, 'disc')).join('')
        + '<span class="review-sep"></span>'
        + tileEl(rec.drawn, 'disc drawn')
        + '</div>';
    }

    // Rebuild the exact feedback panel of a turn from its stored record.
    // `review` re-displays an older turn, so it also recalls the hand at the time.
    function renderFeedback(rec, review) {
      const userData = rec.user;
      const engData = rec.eng;
      const engTile = rec.engDiscard;
      const diff = engData.number - userData.number;
      const accImgs = (acc) => acc.map(t => tileImg(t, 'mini static')).join('') || '∅';
      let html = '';
      if (review) {
        html += `<div class="review-head">Turn ${rec.turn} of ${state.history.length}`
          + `<button type="button" class="link-btn" id="latestTurnBtn">Back to last turn</button>`
          + `</div>` + handPreview(rec);
      }
      html +=
        `<div><b>${rec.isError ? '✗ Suboptimal' : '✓ Good choice'}</b> — `
        + `you discarded ${tileImg(rec.discard, 'mini static')} `
        + `(acceptance ${userData.number} tiles) — <b>${userData.away}-away</b>.</div>`
        + `<div>Best discard: ${tileImg(engTile, 'mini static')} `
        + `(acceptance ${engData.number} tiles) — <b>${engData.away}-away</b>`
        + (engData.best_away !== undefined && engData.best_away < engData.away
            ? `, ${engData.best_away}-away possible`
            : ``)
        + `. `;
      if (rec.isError && userData.away === engData.away) {
        html += `<div>Difference: <b>${diff} tiles</b>.</div>`
      }
      html += `<div class="accrow">Your acceptance: ${accImgs(userData.acceptance)}</div>`
          + `<div class="accrow">Best acceptance: ${accImgs(engData.acceptance)}</div>`;
      if (rec.isError) {
        html += `<div class="type-cols">`
          + `<div class="type-col"><h4>Your best hand types</h4>${typeBreakdown(userData.best_results_acceptance)}</div>`
          + `<div class="type-col"><h4>Engine's best hand types</h4>${typeBreakdown(engData.best_results_acceptance)}</div>`
          + `</div>`;
      }
      const fb = document.getElementById('feedback');
      fb.className = 'feedback ' + (rec.isError ? 'error' : 'ok');
      fb.innerHTML = html;
      const back = document.getElementById('latestTurnBtn');
      if (back) {
        back.addEventListener('click', () => {
          renderFeedback(state.history[state.history.length - 1], false);
        });
      }
      state.selectedTurn = review ? rec.turn - 1 : null;
      renderDiscards();
    }

    function reviewTurn(index) {
      const rec = state.history[index];
      if (rec) renderFeedback(rec, true);
    }

    function typeBreakdown(rows) {
      if (!rows || !rows.length) return '<div class="type-row">—</div>';
      return rows.map(r => {
        const imgs = r.acceptance.map(t => tileImg(t, 'mini static')).join('') || '∅';
        return `<div class="type-row"><span class="type-name">${r.type}</span>`
          + `${imgs} <span style="color:#cfe9cf">(${r.number} tiles)</span></div>`;
      }).join('');
    }

    function showWins(wins) {
      setMessage(`<b>Tenpai!</b> Final accuracy: `
        + `${Math.round((state.turns - state.errors) / state.turns * 100)}% `
        + `(${state.turns - state.errors}/${state.turns}). Winning possibilities:`);
      const container = document.getElementById('wins');
      container.innerHTML = wins.map(w => {
        const valid = w.points >= 8;
        let highlighted = false;
        const groups = w.won_groups.map(g => {
          const inner = g.map(t => {
            const isWin = !highlighted && t === w.tile;
            if (isWin) highlighted = true;
            return tileEl(t, 'tile static' + (isWin ? ' drawn-tile' : ''));
          }).join('');
          return `<span class="tile-group">${inner}</span>`;
        }).join('');
        const badge = valid
          ? '<span class="badge valid">VALID</span>'
          : '<span class="badge invalid">&lt; 8 pts</span>';
        return `<div class="win-card ${valid ? 'valid' : 'invalid'}">`
          + `<div>Win on ${tileImg(w.tile, 'mini static')} — <b>${w.points} points</b>${badge}</div>`
          + `<div class="win-tiles" style="margin-top:8px">${groups}</div>`
          + `<pre>${w.table}</pre></div>`;
      }).join('');
    }

    // ---- run sharing: seed + choices + every analysis, packed into the URL ----
    // Payload v1 (see below) is JSON -> deflate-raw -> base64url, prefixed by a
    // one-char codec flag ('z' deflate-raw, 'u' plain) so old links stay readable.
    //   {v, s:seed, pw, sw, h:[13 tile idx], L:[type labels], t:[turns], w:wins|null}
    //   turn  = [drawnIdx, discardIdx, engDiscardIdx, engBlock, userBlock|null]
    //   block = [away, [accIdx...], [[labelId, [accIdx...]], ...], best_away?]
    // ``best_away`` is optional (engine blocks only, and only when it differs from
    // ``away``), so links produced before it existed still decode.
    //   wins  = [[tileIdx, points, table, [[tileIdx...], ...]], ...]
    // Acceptance *numbers* are never stored: they are a pure function of the
    // acceptance tiles and of the visible-tile vector, which the decoder replays.
    const RUN_PARAM = '#r=';

    function b64urlEncode(bytes) {
      let bin = '';
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    function b64urlDecode(str) {
      const bin = atob(str.replace(/-/g, '+').replace(/_/g, '/'));
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    async function pipeThrough(bytes, stream) {
      const blob = new Blob([bytes]).stream().pipeThrough(stream);
      return new Uint8Array(await new Response(blob).arrayBuffer());
    }
    async function packRun(obj) {
      const bytes = new TextEncoder().encode(JSON.stringify(obj));
      try {
        return 'z' + b64urlEncode(await pipeThrough(bytes, new CompressionStream('deflate-raw')));
      } catch (e) {
        return 'u' + b64urlEncode(bytes);  // browser without CompressionStream
      }
    }
    async function unpackRun(param) {
      let bytes = b64urlDecode(param.slice(1));
      if (param[0] === 'z') {
        bytes = await pipeThrough(bytes, new DecompressionStream('deflate-raw'));
      }
      return JSON.parse(new TextDecoder().decode(bytes));
    }

    function acceptanceNumber(acceptance, visible) {
      return acceptance.reduce((sum, t) => sum + (4 - visible[tileIndex(t)]), 0);
    }

    function buildRunPayload() {
      const labels = [];
      const labelId = (name) => {
        let i = labels.indexOf(name);
        if (i < 0) { i = labels.length; labels.push(name); }
        return i;
      };
      const encBlock = (d) => {
        const block = [
          d.away,
          d.acceptance.map(tileIndex),
          (d.best_results_acceptance || []).map(r => [labelId(r.type), r.acceptance.map(tileIndex)]),
        ];
        if (d.best_away !== undefined && d.best_away < d.away) block.push(d.best_away);
        return block;
      };
      const turns = state.history.map(rec => [
        tileIndex(rec.drawn), tileIndex(rec.discard), tileIndex(rec.engDiscard),
        encBlock(rec.eng),
        rec.discard === rec.engDiscard ? null : encBlock(rec.user),
      ]);
      const wins = state.wins
        ? state.wins.map(w => [tileIndex(w.tile), w.points, w.table,
                               w.won_groups.map(g => g.map(tileIndex))])
        : null;
      return {
        v: 1, s: state.seed, pw: state.prevalentWind, sw: state.seatWind,
        h: state.initialHand.map(tileIndex), L: labels, t: turns, w: wins,
      };
    }

    function decodeRunPayload(p) {
      if (!p || p.v !== 1) throw new Error('unsupported run format');
      const labels = p.L || [];
      const decBlock = (b, visible) => {
        const acceptance = b[1].map(tileFromIndex);
        return {
          away: b[0],
          best_away: b.length > 3 ? b[3] : b[0],
          acceptance,
          number: acceptanceNumber(acceptance, visible),
          best_results_acceptance: (b[2] || []).map(r => {
            const acc = r[1].map(tileFromIndex);
            return { type: labels[r[0]], acceptance: acc, number: acceptanceNumber(acc, visible) };
          }),
        };
      };
      const hand = p.h.map(tileFromIndex);
      const visible = new Array(34).fill(0);
      hand.forEach(t => visible[tileIndex(t)]++);
      const run = {
        pool: null, pointer: 0, hand, visible, discards: [], turns: 0, errors: 0,
        drawn: null, turnData: null, seed: p.s,
        prevalentWind: p.pw, seatWind: p.sw,
        initialHand: [...hand], history: [], wins: null,
        selectedTurn: null, replay: true, finished: true,
      };
      for (const t of p.t) {
        const drawn = tileFromIndex(t[0]);
        run.hand.push(drawn);
        run.visible[tileIndex(drawn)]++;
        const handBefore = [...run.hand];
        const eng = decBlock(t[3], run.visible);
        const user = t[4] ? decBlock(t[4], run.visible) : eng;
        const discard = tileFromIndex(t[1]);
        const engDiscard = tileFromIndex(t[2]);
        const isError = user.away > eng.away
          || (user.away === eng.away && user.number < eng.number);
        run.turns++;
        if (isError) run.errors++;
        removeOne(run.hand, discard);
        run.discards.push(discard);
        run.history.push({
          turn: run.turns, drawn, handBefore, discard, engDiscard, user, eng, isError,
        });
      }
      run.wins = p.w
        ? p.w.map(w => ({
            tile: tileFromIndex(w[0]), points: w[1], table: w[2],
            won_groups: w[3].map(g => g.map(tileFromIndex)),
          }))
        : null;
      return run;
    }

    function clearRunHash() {
      if (location.hash.startsWith(RUN_PARAM)) {
        history.replaceState(null, '', location.href.split('#')[0]);
      }
    }

    async function copyRunLink() {
      const btn = document.getElementById('shareBtn');
      const original = 'Copy run link';
      btn.disabled = true;
      try {
        const param = await packRun(buildRunPayload());
        const url = location.href.split('#')[0] + RUN_PARAM + param;
        const done = () => {
          btn.textContent = 'Link copied!';
          setTimeout(() => { btn.textContent = original; }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(url);
          done();
        } else {
          const inp = document.getElementById('seedInput');
          inp.value = url; inp.select(); document.execCommand('copy'); done();
        }
      } catch (err) {
        btn.textContent = 'Share failed';
        setTimeout(() => { btn.textContent = original; }, 1500);
      } finally {
        btn.disabled = false;
      }
    }

    async function loadSharedRun(param) {
      try {
        state = decodeRunPayload(await unpackRun(param));
      } catch (err) {
        setMessage('This shared run link could not be read.');
        return;
      }
      showSeed(state.seed);
      const last = state.history[state.history.length - 1];
      renderHand(false);
      updateStats(last ? last.user.away : '--');
      document.getElementById('seedInput').value = state.seed;
      if (state.wins) {
        showWins(state.wins);
      } else {
        setMessage('<b>Shared run</b> — click any discard to review that turn. '
          + 'Press “New Game” to play this deal yourself (seed is pre-filled).');
      }
      if (last) renderFeedback(last, false);
      renderDiscards();
    }
    document.getElementById('newGameBtn').addEventListener('click', () => newGame().catch(engineFailure));
    document.getElementById('shareBtn').addEventListener('click', copyRunLink);
    document.getElementById('copySeedBtn').addEventListener('click', () => {
      const seed = document.getElementById('seedValue').textContent;
      const btn = document.getElementById('copySeedBtn');
      const done = () => { btn.textContent = 'Copied!'; setTimeout(() => { btn.textContent = 'Copy'; }, 1200); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(seed).then(done).catch(() => {});
      } else {
        const inp = document.getElementById('seedInput');
        inp.value = seed; inp.select(); document.execCommand('copy'); done();
      }
    });
    window.trainer = {
      state: () => state,
      buildRunPayload, decodeRunPayload, packRun, unpackRun,
    };

    // a shared run replays entirely from the URL: no engine round-trip needed
    if (location.hash.startsWith(RUN_PARAM)) {
      loadSharedRun(location.hash.slice(RUN_PARAM.length));
    }
  </script>
