<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MCR Discard Rollout Analyzer</title>
  <style>
    :root { --tile-s: 56px; }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, Arial, sans-serif;
      margin: 0; padding: 20px; background: #0f5132; color: #f5f5f5;
      overflow-x: hidden;
    }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .sub { color: #cfe9cf; font-size: 14px; margin-bottom: 16px; }
    .panel {
      background: #114d2c; padding: 14px 16px; border-radius: 10px; margin-bottom: 16px;
    }
    label { font-size: 13px; color: #d7e7d7; display: block; margin-bottom: 4px; }
    input[type=text], input[type=number], select {
      font-size: 15px; padding: 8px 10px; border: none; border-radius: 6px;
      background: #f5f5f5; color: #222;
    }
    .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
    .field { display: flex; flex-direction: column; }
    .field.grow { flex: 1 1 260px; }
    .field input[type=text] { width: 100%; }
    .field.small input { width: 90px; }
    button {
      font-size: 15px; padding: 10px 18px; border: none; border-radius: 6px;
      background: #ffc107; color: #222; cursor: pointer; font-weight: 600;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    button.secondary { background: #2f6f4a; color: #f5f5f5; }
    .hand-preview { display: flex; align-items: flex-end; gap: 2px; flex-wrap: wrap; min-height: 60px; margin-top: 6px; }
    .tile {
      display: inline-block; width: calc(var(--tile-s) * 82 / 128); height: var(--tile-s);
      background-repeat: no-repeat; background-size: var(--tile-s) var(--tile-s);
      background-position: calc(var(--tile-s) * -23 / 128) 0; border-radius: 4px;
    }
    #status { min-height: 22px; margin: 12px 0; font-size: 15px; }
    .prog-wrap { background: rgba(0,0,0,0.25); border-radius: 6px; height: 14px; overflow: hidden; margin: 8px 0; display: none; }
    .prog-bar { background: #ffc107; height: 100%; width: 0%; transition: width 0.2s; }
    .engines { font-size: 12px; color: #cfe9cf; }
    table { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 14px; }
    th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.12); }
    th:first-child, td:first-child { text-align: left; }
    thead th { color: #ffe08a; font-size: 13px; }
    tbody tr.best { background: rgba(255,193,7,0.14); }
    tbody tr.best td:first-child { font-weight: 700; }
    tbody tr.pruned { opacity: 0.42; }
    tbody tr.pruned td:first-child::after {
      content: 'out'; font-size: 10px; font-weight: 700; color: #f0a; margin-left: 6px;
      background: rgba(255,0,170,0.15); padding: 1px 5px; border-radius: 8px; vertical-align: 1px;
    }
    td.prov { color: #a8c9b3; }
    .disc-cell { display: flex; align-items: center; gap: 8px; }
    .ci { color: #cfe9cf; font-size: 12px; }
    .note { margin-top: 12px; font-size: 13px; color: #ffe08a; }
    .spinner::after {
      content: ''; display: inline-block; width: 12px; height: 12px; margin-left: 8px;
      vertical-align: -1px; border: 2px solid rgba(255,255,255,0.35); border-top-color: #ffc107;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    code { background: rgba(0,0,0,0.25); padding: 1px 5px; border-radius: 4px; }
    @media (max-width: 600px) {
      :root { --tile-s: 46px; }
      body { padding: 12px; }
    }
  </style>
</head>
<body>
  <h1>MCR Discard Rollout Analyzer</h1>
  <div class="sub">
    Estimates each candidate discard's chance of reaching a legal (&ge;8-point) MCR win
    by Monte-Carlo rollouts &mdash; running entirely on <b>your</b> hardware across
    <span id="coreCount">?</span> parallel engines.
  </div>

  <div class="panel">
    <div class="row">
      <div class="field grow">
        <label for="handInput">14-tile hand (e.g. <code>13m35679s24567p55z</code>)</label>
        <input id="handInput" type="text" value="13m35679s24567p55z" spellcheck="false" autocapitalize="off">
      </div>
      <div class="field grow">
        <label for="choicesInput">Candidate discards (optional shortlist, e.g. <code>6s2p7p3s</code>)</label>
        <input id="choicesInput" type="text" value="6s2p7p3s" spellcheck="false" autocapitalize="off">
      </div>
    </div>
    <div class="hand-preview" id="handPreview"></div>
    <div class="row" style="margin-top:12px">
      <div class="field small">
        <label for="modeInput">Mode</label>
        <select id="modeInput">
          <option value="adaptive" selected>Adaptive (auto-stop)</option>
          <option value="fixed">Fixed rollouts</option>
        </select>
      </div>
      <div class="field small">
        <label id="rolloutsLabel" for="rolloutsInput">Max rollouts / choice</label>
        <input id="rolloutsInput" type="number" min="10" max="2000" step="10" value="150">
      </div>
      <div class="field small" id="targetField">
        <label for="targetInput">Target P(best) %</label>
        <input id="targetInput" type="number" min="50" max="99" step="1" value="90">
      </div>
      <div class="field small" id="batchField">
        <label for="batchInput" title="Rollouts added per adaptive wave. Defaults to your core count.">Batch / wave</label>
        <input id="batchInput" type="number" min="1" max="500" step="1">
      </div>
      <div class="field small">
        <label for="budgetInput">Draw budget</label>
        <input id="budgetInput" type="number" min="6" max="40" step="1" value="22">
      </div>
      <div class="field small">
        <label for="prevalentWind">Round wind</label>
        <select id="prevalentWind">
          <option value="0">None</option><option value="1">East</option>
          <option value="2">South</option><option value="3">West</option><option value="4">North</option>
        </select>
      </div>
      <div class="field small">
        <label for="seatWind">Seat wind</label>
        <select id="seatWind">
          <option value="0">None</option><option value="1">East</option>
          <option value="2">South</option><option value="3">West</option><option value="4">North</option>
        </select>
      </div>
      <div class="field small">
        <label for="seedInput">Seed</label>
        <input id="seedInput" type="number" min="0" step="1" value="12648430">
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button id="runBtn" disabled>Loading engines…</button>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button id="stopBtn" class="secondary" style="display:none">Stop</button>
      </div>
    </div>
    <div class="engines" id="engineStatus"></div>
  </div>

  <div id="status"></div>
  <div class="prog-wrap" id="progWrap"><div class="prog-bar" id="progBar"></div></div>

  <div id="results"></div>

  <script>
    const FAMILY_OFFSET = { m: 0, p: 9, s: 18, z: 27 };
    function tileEl(t) {
      return `<span class="tile" style="background-image:url('tiles-png/${t}.png')"></span>`;
    }
    // Parse a hand string (ignoring declared-group brackets) into a sorted list of
    // tile strings, purely for the visual preview.
    function parseHandPreview(str) {
      const tiles = [];
      let nums = [];
      for (const ch of str) {
        if (ch >= '1' && ch <= '9') nums.push(ch);
        else if ('mpsz'.includes(ch)) { nums.forEach(n => tiles.push(n + ch)); nums = []; }
      }
      const idx = t => FAMILY_OFFSET[t[1]] + (parseInt(t[0], 10) - 1);
      return tiles.sort((a, b) => idx(a) - idx(b));
    }
    function renderPreview() {
      const tiles = parseHandPreview(document.getElementById('handInput').value);
      document.getElementById('handPreview').innerHTML = tiles.map(tileEl).join('');
    }
    document.getElementById('handInput').addEventListener('input', renderPreview);
    renderPreview();

    // ---------- worker pool ----------
    const APP_VERSION = "2026-07-31-1";
    const POOL_SIZE = Math.max(1, Math.min(navigator.hardwareConcurrency || 4, 16));
    document.getElementById('coreCount').textContent = POOL_SIZE;
    // Default the adaptive wave size to the core count (POOL_SIZE) so each wave
    // hands roughly one fresh rollout column per engine; user can override.
    document.getElementById('batchInput').value = POOL_SIZE;
    document.getElementById('batchInput').placeholder = POOL_SIZE;

    const workers = [];
    let readyCount = 0;
    let reqId = 0;
    const pending = {};   // id -> {resolve, reject}

    function makeWorker() {
      const w = new Worker('rollout_worker.js?v=' + APP_VERSION, { type: 'module' });
      w.onmessage = (event) => {
        const msg = event.data;
        if (msg.type === 'ready') {
          readyCount++;
          updateEngineStatus();
          if (readyCount === POOL_SIZE) {
            const btn = document.getElementById('runBtn');
            btn.disabled = false; btn.textContent = 'Analyze';
            setStatus('Engines ready. Click <b>Analyze</b>.');
          }
          return;
        }
        if (msg.type === 'fatal') { setStatus('Engine failed to load: ' + msg.error); return; }
        const cb = pending[msg.id];
        if (!cb) return;
        delete pending[msg.id];
        if (msg.type === 'error') cb.reject(new Error(msg.error));
        else cb.resolve(msg.result);
      };
      w.onerror = (e) => setStatus('Engine error: ' + e.message);
      return w;
    }
    function pyCall(worker, fn, ...args) {
      return new Promise((resolve, reject) => {
        const id = ++reqId;
        pending[id] = { resolve, reject };
        worker.postMessage({ id, fn, args });
      });
    }
    for (let i = 0; i < POOL_SIZE; i++) workers.push(makeWorker());

    function updateEngineStatus() {
      document.getElementById('engineStatus').textContent =
        `${readyCount}/${POOL_SIZE} engines ready`;
    }
    function setStatus(html) { document.getElementById('status').innerHTML = html; }

    // ---------- mode toggle ----------
    const modeInput = document.getElementById('modeInput');
    function syncMode() {
      const adaptive = modeInput.value === 'adaptive';
      document.getElementById('targetField').style.display = adaptive ? '' : 'none';
      document.getElementById('batchField').style.display = adaptive ? '' : 'none';
      document.getElementById('rolloutsLabel').textContent =
        adaptive ? 'Max rollouts / choice' : 'Rollouts / choice';
    }
    modeInput.addEventListener('change', syncMode);
    syncMode();

    // JS mirror of rollout_evaluator._wilson_ci, used for the provisional table
    // that streams *during* a wave (authoritative P(best) still comes from Python
    // at each wave boundary).
    function wilsonCI(wins, n, z = 1.96) {
      if (n === 0) return [0, 1];
      const p = wins / n;
      const denom = 1 + z * z / n;
      const center = (p + z * z / (2 * n)) / denom;
      const half = (z * Math.sqrt((p * (1 - p) + z * z / (4 * n)) / n)) / denom;
      return [Math.max(0, center - half), Math.min(1, center + half)];
    }
    function pctFmt(x) { return (x * 100).toFixed(1) + '%'; }

    // ---------- orchestration (adaptive wave loop, streamed live) ----------
    let running = false;
    let cancelRequested = false;

    async function analyze() {
      if (running) return;
      running = true;
      cancelRequested = false;
      const btn = document.getElementById('runBtn');
      const stopBtn = document.getElementById('stopBtn');
      btn.disabled = true;
      stopBtn.style.display = ''; stopBtn.disabled = false; stopBtn.textContent = 'Stop';
      document.getElementById('results').innerHTML = '';

      const hand = document.getElementById('handInput').value.trim();
      const choices = document.getElementById('choicesInput').value.trim();
      const mode = modeInput.value;
      const adaptive = mode === 'adaptive';
      const maxRollouts = parseInt(document.getElementById('rolloutsInput').value, 10) || 150;
      const target = (parseInt(document.getElementById('targetInput').value, 10) || 90) / 100;
      const budget = parseInt(document.getElementById('budgetInput').value, 10) || 22;
      const pw = parseInt(document.getElementById('prevalentWind').value, 10) || 0;
      const sw = parseInt(document.getElementById('seatWind').value, 10) || 0;
      const seed = parseInt(document.getElementById('seedInput').value, 10) || 0;

      let ctxJson;
      try {
        setStatus('<span class="spinner">Preparing</span>');
        // ctx.rollouts = maxRollouts is the column capacity of the win matrix.
        ctxJson = await pyCall(workers[0], 'prepare', hand, choices, maxRollouts, budget, pw, sw, 'greedy', seed);
      } catch (err) {
        setStatus('Error: ' + err.message);
        running = false; btn.disabled = false;
        stopBtn.style.display = 'none';
        return;
      }
      const ctx = JSON.parse(ctxJson);
      const nChoices = ctx.choices.length;
      if (nChoices === 0) {
        setStatus('No candidate discards found.');
        running = false; btn.disabled = false;
        stopBtn.style.display = 'none';
        return;
      }

      // Wave parameters (mirror evaluate_discard_choices_adaptive). Fixed mode is
      // just a single wave of `maxRollouts` with early-stop/pruning disabled.
      const INIT = adaptive ? Math.min(24, maxRollouts) : maxRollouts;
      // Batch (rollouts added per adaptive wave) defaults to the core count so each
      // wave scales with the user's hardware; overridable via the Batch field.
      const BATCH = adaptive
        ? Math.max(1, parseInt(document.getElementById('batchInput').value, 10) || POOL_SIZE)
        : maxRollouts;
      const TARGET = adaptive ? target : 2;   // 2 = unreachable => never early-stop
      const PRUNE = adaptive;

      // Per-choice running tallies, accumulated across all waves. nBy[ci] tracks how
      // many rollouts a choice has been sampled: it rises to `done` for active
      // choices and freezes when a choice is pruned.
      const nBy = new Array(nChoices).fill(0);
      const winsBy = new Array(nChoices).fill(0);
      const ptsBy = new Array(nChoices).fill(0);
      const trnBy = new Array(nChoices).fill(0);
      const results = [];                                 // full [ci,r,won,turns,points]
      let probBestBy = new Array(nChoices).fill(null);    // authoritative, wave boundaries
      let active = new Set(Array.from({ length: nChoices }, (_, i) => i));

      const t0 = performance.now();
      document.getElementById('progWrap').style.display = 'block';

      let done = 0, wave = 0, lastRender = 0;
      let waveReceived = 0, waveTotal = 0;

      function updateProgress() {
        const pct = waveTotal ? (waveReceived / waveTotal * 100) : 0;
        document.getElementById('progBar').style.width = pct.toFixed(1) + '%';
        const elapsed = (performance.now() - t0) / 1000;
        const rate = waveReceived > 0 ? elapsed / (results.length) : 0;
        const eta = rate * (waveTotal - waveReceived);
        setStatus(`<span class="spinner">Wave ${wave + 1}</span> &mdash; `
          + `${active.size} active &times; ${done + Math.round(waveReceived / Math.max(active.size, 1))} rollouts `
          + `(this wave ${waveReceived}/${waveTotal}, ~${eta.toFixed(0)}s)`);
      }

      function renderLive(finalNote) {
        const rows = [];
        for (let ci = 0; ci < nChoices; ci++) {
          const n = nBy[ci];
          const wr = n ? winsBy[ci] / n : 0;
          const [lo, hi] = wilsonCI(winsBy[ci], n);
          rows.push({
            tile: ctx.choices[ci].name,
            n, win_rate: wr, ci_low: lo, ci_high: hi,
            prob_best: probBestBy[ci],
            avg_points: winsBy[ci] ? ptsBy[ci] / winsBy[ci] : null,
            avg_turns: winsBy[ci] ? trnBy[ci] / winsBy[ci] : null,
            ev: wr * (winsBy[ci] ? ptsBy[ci] / winsBy[ci] : 0),
            active: active.has(ci),
          });
        }
        rows.sort((a, b) => {
          const pa = a.prob_best == null ? -1 : a.prob_best;
          const pb = b.prob_best == null ? -1 : b.prob_best;
          if (pb !== pa) return pb - pa;
          return b.win_rate - a.win_rate;
        });
        renderRows(rows, finalNote);
      }

      try {
        while (true) {
          const want = Math.min(wave === 0 ? INIT : BATCH, maxRollouts - done);
          if (want <= 0) break;

          const activeIds = Array.from(active).sort((a, b) => a - b);
          // Wave task list: new rollout columns [done, done+want) for active choices.
          const tasks = [];
          for (let r = done; r < done + want; r++)
            for (const ci of activeIds) tasks.push([ci, r]);
          waveTotal = tasks.length; waveReceived = 0;

          // Small chunks => good load balancing (mirrors the desktop chunksize=1).
          const CHUNK = Math.max(1, Math.min(4, Math.ceil(tasks.length / (POOL_SIZE * 8))));
          const chunks = [];
          for (let i = 0; i < tasks.length; i += CHUNK) chunks.push(tasks.slice(i, i + CHUNK));
          let nextChunk = 0;
          updateProgress();

          // Dynamic work queue: feed each worker the next chunk as it frees up, and
          // stream the provisional table as results arrive. Stops pulling new chunks
          // once the user requests cancellation (in-flight chunks still settle).
          async function pump(worker) {
            while (nextChunk < chunks.length && !cancelRequested) {
              const chunk = chunks[nextChunk++];
              const rows = JSON.parse(await pyCall(worker, 'run_chunk', ctxJson, JSON.stringify(chunk)));
              for (const [ci, r, won, turns, points] of rows) {
                results.push([ci, r, won, turns, points]);
                nBy[ci] += 1;
                if (won) { winsBy[ci] += 1; ptsBy[ci] += points; trnBy[ci] += turns; }
              }
              waveReceived += chunk.length;
              const now = performance.now();
              if (now - lastRender > 180) { lastRender = now; updateProgress(); renderLive(); }
            }
          }
          await Promise.all(workers.map(pump));

          // Cancelled mid-wave: drop this wave's partial (ragged) columns so the
          // final stats rest only on fully-sampled columns [0, done), then finalize.
          if (cancelRequested) {
            const kept = results.filter(([, r]) => r < done);
            results.length = 0; results.push(...kept);
            nBy.fill(0); winsBy.fill(0); ptsBy.fill(0); trnBy.fill(0);
            for (const [ci, r, won, turns, points] of results) {
              nBy[ci] += 1;
              if (won) { winsBy[ci] += 1; ptsBy[ci] += points; trnBy[ci] += turns; }
            }
            break;
          }
          done += want;

          // Authoritative wave-boundary stats from Python (paired bootstrap over the
          // active choices on shared columns [0, done)). Identical to the desktop
          // adaptive run.
          setStatus(`<span class="spinner">Scoring wave ${wave + 1}</span> &mdash; `
            + `${done} rollouts / active choice so far&hellip;`);
          const agg = JSON.parse(await pyCall(workers[0], 'aggregate_adaptive', ctxJson,
            JSON.stringify(results), JSON.stringify(activeIds), JSON.stringify(nBy), done));
          probBestBy = new Array(nChoices).fill(0);
          for (const row of agg.table) probBestBy[row.pos] = row.prob_best;
          renderLive();

          // Leader + stop condition.
          let leader = -1, leaderP = -1;
          for (const ci of active) if (probBestBy[ci] > leaderP) { leaderP = probBestBy[ci]; leader = ci; }
          if (leaderP >= TARGET || done >= maxRollouts) break;

          // Prune choices that are statistically out of the race (95% CI upper bound
          // below the leader's lower bound). The leader is never pruned; keep >= 2.
          if (PRUNE && active.size > 2) {
            const [leadLo] = wilsonCI(winsBy[leader], done);
            const drop = [];
            for (const ci of active) {
              if (ci === leader) continue;
              const [, hi] = wilsonCI(winsBy[ci], done);
              if (hi < leadLo) drop.push(ci);
            }
            if (drop.length && active.size - drop.length >= 2)
              for (const ci of drop) active.delete(ci);
          }
          wave += 1;
        }

        // After a mid-run stop, refresh the authoritative P(best) so the final table
        // is consistent with the committed columns [0, done) (skipped if nothing
        // completed, or on a normal finish which already aggregated at the boundary).
        if (cancelRequested && done > 0) {
          const finalActive = Array.from(active).sort((a, b) => a - b);
          const agg = JSON.parse(await pyCall(workers[0], 'aggregate_adaptive', ctxJson,
            JSON.stringify(results), JSON.stringify(finalActive), JSON.stringify(nBy), done));
          probBestBy = new Array(nChoices).fill(0);
          for (const row of agg.table) probBestBy[row.pos] = row.prob_best;
        }

        const secs = ((performance.now() - t0) / 1000).toFixed(1);
        renderLive(true);
        if (cancelRequested) {
          setStatus(`Stopped after ${secs}s &mdash; ${done} completed rollouts / active choice`
            + (done > 0 ? '' : ' (no full rollout finished)')
            + ` across ${POOL_SIZE} engines.`);
        } else {
          setStatus(`Done in ${secs}s &mdash; ${done} rollouts / active choice across ${POOL_SIZE} engines.`);
        }
      } catch (err) {
        setStatus('Error during rollouts: ' + err.message);
      } finally {
        document.getElementById('progWrap').style.display = 'none';
        running = false;
        cancelRequested = false;
        btn.disabled = false;
        document.getElementById('stopBtn').style.display = 'none';
      }
    }

    function renderRows(rows, finalNote) {
      if (!rows.length) { document.getElementById('results').innerHTML = ''; return; }
      let html = `<table><thead><tr>`
        + `<th>discard</th><th>win%</th><th>95% CI</th><th>P(best)</th>`
        + `<th>avg pts</th><th>avg turns</th><th>EV</th><th>n</th></tr></thead><tbody>`;
      let leaderShown = false;
      rows.forEach((s) => {
        const ci = `${(s.ci_low * 100).toFixed(0)}&ndash;${(s.ci_high * 100).toFixed(0)}%`;
        const pts = s.avg_points != null ? s.avg_points.toFixed(1) : '&ndash;';
        const trn = s.avg_turns != null ? s.avg_turns.toFixed(1) : '&ndash;';
        const pbProv = s.prob_best == null;
        const pb = pbProv ? '&hellip;' : (s.prob_best * 100).toFixed(0) + '%';
        const cls = [];
        const isLeader = s.active && !leaderShown;
        if (isLeader) { cls.push('best'); leaderShown = true; }
        if (!s.active) cls.push('pruned');
        html += `<tr class="${cls.join(' ')}">`
          + `<td><div class="disc-cell">${tileEl(s.tile)}<span>${s.tile}</span></div></td>`
          + `<td>${pctFmt(s.win_rate)}</td>`
          + `<td class="ci">${ci}</td>`
          + `<td class="${pbProv ? 'prov' : ''}">${pb}</td>`
          + `<td>${pts}</td><td>${trn}</td><td>${s.ev.toFixed(2)}</td>`
          + `<td class="ci">${s.n}</td></tr>`;
      });
      html += `</tbody></table>`;

      if (finalNote) {
        const activeRows = rows.filter(r => r.active);
        const top = activeRows[0], second = activeRows[1];
        if (top && top.prob_best != null && top.prob_best >= 0.90) {
          html += `<div class="note">Confident pick: <b>discard ${top.tile}</b> `
            + `(P(best)=${(top.prob_best * 100).toFixed(0)}%).</div>`;
        } else if (top && second) {
          html += `<div class="note">Top choice <b>${top.tile}</b> is only `
            + `P(best)=${((top.prob_best || 0) * 100).toFixed(0)}% (next: ${second.tile} at `
            + `${((second.prob_best || 0) * 100).toFixed(0)}%). Raise "Max rollouts" or lower the target for a confident pick.</div>`;
        }
      }
      document.getElementById('results').innerHTML = html;
    }

    document.getElementById('runBtn').addEventListener('click', analyze);
    document.getElementById('stopBtn').addEventListener('click', () => {
      if (!running) return;
      cancelRequested = true;
      const stopBtn = document.getElementById('stopBtn');
      stopBtn.disabled = true; stopBtn.textContent = 'Stopping…';
      setStatus('<span class="spinner">Stopping</span> &mdash; finishing in-flight rollouts&hellip;');
    });
  </script>
